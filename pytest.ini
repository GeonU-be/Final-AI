[pytest]
# pytest 설정 파일

# 마커 정의
markers =
    integration: 실제 브라우저를 사용하는 통합 테스트 (느리고 불안정할 수 있음)
    slow: 실행 시간이 오래 걸리는 테스트

# 테스트 파일 패턴
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 기본 옵션
addopts = 
    -v
    --tb=short
    --strict-markers

# 비동기 테스트 설정
asyncio_mode = auto

# 테스트 경로
testpaths = test

