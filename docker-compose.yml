version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: final-ai-api
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --reload
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
