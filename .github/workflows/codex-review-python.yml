name: Codex Code Review (Python & Java)

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

jobs:
  codex-review:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GITHUB_TOKEN: ${{ github.token }}

    steps:
      # ✅ 안전: base 브랜치만 checkout
      - name: Checkout base branch (safe)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          fetch-depth: 0

      - name: Get list of changed files
        id: changed-files
        run: |
          set -euo pipefail
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"

          # ✅ 포크 PR 대응: head commit fetch
          git fetch origin "$HEAD_SHA"

          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > changed_files.txt || true
          cat changed_files.txt || true

          FILES=$(paste -sd, changed_files.txt || true)
          echo "files=$FILES" >> "$GITHUB_OUTPUT"

      - name: Validate OpenAI API Key
        run: |
          set -euo pipefail
          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "❌ FATAL ERROR: OPENAI_API_KEY is not set"
            exit 1
          fi
          echo "✅ OPENAI_API_KEY is set (masked)"

      - name: Build Codex prompt from diff
        run: |
          set -euo pipefail
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"

          # head commit 보장
          git fetch origin "$HEAD_SHA" || true

          DIFF_LINES=$(git --no-pager diff --unified=5 "$BASE_SHA" "$HEAD_SHA" | wc -l)
          echo "📊 Diff size: $DIFF_LINES lines"

          if [ "$DIFF_LINES" -gt 5000 ]; then
            echo "⚠️ Diff too large ($DIFF_LINES lines)"
          fi

          cat > codex-prompt.md << 'EOF'
          당신은 Python 및 Java 백엔드를 담당하는 시니어 풀스택 개발자입니다.
          아래 Pull Request의 변경 사항에 대해 코드 리뷰를 수행하십시오.
          
          - 반드시 한국어로, 존댓말(하십시오체)로 답변하십시오.
          - 결과는 JSON 배열만 출력하십시오.
          EOF

          echo "=== DIFF START ===" >> codex-prompt.md
          git --no-pager diff --unified=5 "$BASE_SHA" "$HEAD_SHA" >> codex-prompt.md

      - name: Run Codex review
        id: run-codex
        uses: openai/codex-action@main
        with:
          openai-api-key: ${{ env.OPENAI_API_KEY }}
          prompt-file: codex-prompt.md
          model: gpt-4o-mini
          output-file: codex-output.json
          sandbox: read-only
        continue-on-error: true

      - name: Check Codex review result
        run: |
          set -euo pipefail
          if [ "${{ steps.run-codex.outcome }}" = "failure" ]; then
            echo "❌ Codex review failed"
            exit 1
          fi
          if [ ! -s codex-output.json ]; then
            echo "❌ Codex output missing or empty"
            exit 1
          fi
          echo "✅ Codex review succeeded"

      - name: Post summary comment
        if: success()
        run: |
          set -euo pipefail
          PR_NUMBER=${{ github.event.pull_request.number }}
          REPO=${{ github.repository }}

          jq -n --arg body "**Codex 자동 코드 리뷰가 완료되었습니다.**" \
            '{ body: $body }' > summary.json

          curl -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ github.token }}" \
            "https://api.github.com/repos/$REPO/issues/$PR_NUMBER/comments" \
            -d @summary.json
